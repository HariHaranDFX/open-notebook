name: Build and Release

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Also push latest tags'
        required: true
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  # Publication stays off until the repository variable APPROVE_IMAGE_PUBLISH is true.
  DOCKERHUB_IMAGE: haribabudfx/open-notebook-commercial

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_dockerhub_secrets: ${{ steps.check.outputs.has_dockerhub_secrets }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check for Docker Hub credentials
        id: check
        env:
          SECRET_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SECRET_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n ""$SECRET_DOCKER_USERNAME"" && -n ""$SECRET_DOCKER_PASSWORD"" ]]; then
            echo "has_dockerhub_secrets=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials available"
          else
            echo "has_dockerhub_secrets=false" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials not available"
          fi

  build-regular:
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        if: needs.extract-version.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-regular-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-regular-

      - name: Prepare Docker tags for regular build
        id: tags-regular
        env:
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="${{ env.DOCKERHUB_IMAGE }}:v${{ needs.extract-version.outputs.version }}"
          if [[ "${PUSH_LATEST:-false}" == "true" ]] || [[ "$EVENT_NAME" == "release" && "$PRERELEASE" != "true" ]]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push regular image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ vars.APPROVE_IMAGE_PUBLISH == 'true' }}
          tags: ${{ steps.tags-regular.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-single:
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        if: needs.extract-version.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/.buildx-cache-single
          key: ${{ runner.os }}-buildx-single-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-single-

      - name: Prepare Docker tags for single build
        id: tags-single
        env:
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="${{ env.DOCKERHUB_IMAGE }}:v${{ needs.extract-version.outputs.version }}-single"
          if [[ "${PUSH_LATEST:-false}" == "true" ]] || [[ "$EVENT_NAME" == "release" && "$PRERELEASE" != "true" ]]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest-single"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push single-container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: single
          platforms: linux/amd64,linux/arm64
          push: ${{ vars.APPROVE_IMAGE_PUBLISH == 'true' }}
          tags: ${{ steps.tags-single.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache-single
          cache-to: type=local,dest=/tmp/.buildx-cache-single-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-single
          mv /tmp/.buildx-cache-single-new /tmp/.buildx-cache-single

  summary:
    needs: [extract-version, build-regular, build-single]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        env:
          PUSH_LATEST: ${{ github.event.inputs.push_latest || 'false' }}
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.extract-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Push latest:** ${PUSH_LATEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Registry:" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Docker Hub:** \`${{ env.DOCKERHUB_IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Images Built:" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.build-regular.result }}" == "success" ]]; then
            echo "✅ **Regular:** \`${{ env.DOCKERHUB_IMAGE }}:v${{ needs.extract-version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$PUSH_LATEST" == "true" ]]; then
              echo "✅ **Regular latest:** \`${{ env.DOCKERHUB_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "${{ needs.build-regular.result }}" == "skipped" ]]; then
            echo "⏭️ **Regular:** Skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Regular:** Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${{ needs.build-single.result }}" == "success" ]]; then
            echo "✅ **Single:** \`${{ env.DOCKERHUB_IMAGE }}:v${{ needs.extract-version.outputs.version }}-single\`" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$PUSH_LATEST" == "true" ]]; then
              echo "✅ **Single latest:** \`${{ env.DOCKERHUB_IMAGE }}:latest-single\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "${{ needs.build-single.result }}" == "skipped" ]]; then
            echo "⏭️ **Single:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Single:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY