services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    # Credentials default to root:root for a zero-config local setup. Before
    # exposing this instance to a network, set SURREAL_USER / SURREAL_PASSWORD
    # in a .env file (see .env.example) — they are applied here and to the
    # open_notebook service below, so the two always stay in sync.
    # List (exec) form so each interpolated value stays a single argument —
    # a password containing spaces would otherwise be split into several.
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root  # Required for bind mounts on Linux
    ports:
      # Bound to localhost only: the open_notebook service reaches this over
      # the internal compose network regardless, so the host port is purely
      # for local debugging (e.g. Surrealist, `surreal sql`). Exposing this
      # on 0.0.0.0 would let anyone who can reach the host connect with the
      # default root:root credentials.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    image: datafabricx/open-notebook-commercial:local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "8502:8502"  # Web UI
      - "5055:5055"  # REST API
    environment:
      # REQUIRED: Change this to your own secret string
      # This encrypts your API keys in the database
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?set encryption key}

      # Database connection. SURREAL_USER / SURREAL_PASSWORD default to root:root
      # for local use; override them in a .env file before exposing the instance
      # (the same values configure the surrealdb service above).
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # Original uploads default to the durable /app/data volume below. To use
      # SharePoint Embedded, set the selector and all SHAREPOINT_STORAGE_* values
      # in .env; these app-only credentials are separate from connector auth.
      - OPEN_NOTEBOOK_ORIGINAL_FILE_STORE=${OPEN_NOTEBOOK_ORIGINAL_FILE_STORE:-filesystem}
      - SHAREPOINT_STORAGE_TENANT_ID=${SHAREPOINT_STORAGE_TENANT_ID:-}
      - SHAREPOINT_STORAGE_CLIENT_ID=${SHAREPOINT_STORAGE_CLIENT_ID:-}
      - SHAREPOINT_STORAGE_CLIENT_SECRET=${SHAREPOINT_STORAGE_CLIENT_SECRET:-}
      - SHAREPOINT_STORAGE_PROFILE_ID=${SHAREPOINT_STORAGE_PROFILE_ID:-default}
      - SHAREPOINT_STORAGE_PROFILES_FILE=${SHAREPOINT_STORAGE_PROFILES_FILE:-}
      - SHAREPOINT_STORAGE_CERTIFICATE_PFX_PATH=${SHAREPOINT_STORAGE_CERTIFICATE_PFX_PATH:-}
      - SHAREPOINT_STORAGE_CERTIFICATE_PASSPHRASE=${SHAREPOINT_STORAGE_CERTIFICATE_PASSPHRASE:-}
      - SHAREPOINT_STORAGE_CONTAINER_ID=${SHAREPOINT_STORAGE_CONTAINER_ID:-}

      # Delegated connector settings. These are not the storage app credentials.
      - AUTH_PROVIDER=${AUTH_PROVIDER:-password}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-}
      - SHAREPOINT_CONNECTOR_REDIRECT_URI=${SHAREPOINT_CONNECTOR_REDIRECT_URI:-}

      # OPTIONAL: heavy extraction runtimes, installed on first startup when
      # enabled (downloads are cached on the ./notebook_data volume, so only the
      # first boot is slow). See docs/5-CONFIGURATION/environment-reference.md.
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true    # Docling engine + OCR + image sources (large ML stack)
      # - OPEN_NOTEBOOK_ENABLE_CRAWL4AI=true   # local Crawl4AI (bundles a Chromium browser)
      # - CRAWL4AI_API_URL=http://crawl4ai:11235  # use a remote Crawl4AI server instead (no local install)
      # - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}  # bearer token for that server (required by Crawl4AI >= 0.9.0)

      # OPTIONAL: max concurrent background tasks the worker processes at once
      # (default 5). Set to 1 for sequential processing on single-GPU / local
      # LLM setups to avoid overloading the model with parallel requests.
      # - OPEN_NOTEBOOK_WORKER_MAX_TASKS=1

      # OPTIONAL: deployment branding. Uncomment together with the matching
      # read-only config mount below; see docs/BRANDING.md. The selected file is
      # read once when the frontend process starts.
      # - BRAND_CONFIG_PATH=/app/config/brand.json
    volumes:
      - ./notebook_data:/app/data
      # OPTIONAL: select one trusted brand document without rebuilding the image.
      # - ./config/brand.example-client.json:/app/config/brand.json:ro
      # OPTIONAL: required only for root-relative /brand/... asset URLs.
      # HTTPS-hosted logos and favicons do not need this mount.
      # - ./brand-assets:/app/frontend/public/brand:ro
    depends_on:
      - surrealdb
    restart: always
